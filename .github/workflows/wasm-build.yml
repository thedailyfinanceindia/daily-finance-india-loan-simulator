name: Build and Deploy Loan Calculator

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build and Test WebAssembly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Verify Emscripten
        run: emcc --version

      - name: Configure WebAssembly build
        run: |
          emcmake cmake -S . -B build-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF

      - name: Build WebAssembly
        run: cmake --build build-wasm

      - name: Assemble website
        run: |
          cp -R web/. build-wasm/web/
          test -f build-wasm/web/index.html
          test -f build-wasm/web/styles.css
          test -f build-wasm/web/app.js
          test -f build-wasm/web/loan_calculator.js
          test -f build-wasm/web/loan_calculator.wasm
          test -f build-wasm/worker/loan_worker.wasm

      - name: Set up Node.js for browser tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Worker WebAssembly tests
        run: node tests/wasm/loan_worker.test.cjs

      - name: Run Cloudflare input parser tests
        run: node tests/cloudflare/input_parser.test.cjs

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: node tests/browser/loan-calculator.browser.test.cjs

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: loan-calculator-website
          path: build-wasm/web/
          retention-days: 7

      - name: Upload Worker Wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfi-instagram-worker-wasm
          path: build-wasm/worker/loan_worker.wasm
          retention-days: 7

      - name: Configure GitHub Pages
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-wasm/web/

  deploy-staging-worker:
    name: Deploy Instagram Worker to Cloudflare Staging

    if: >
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main'

    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: dfi-shared-staging-worker
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Worker Wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: dfi-instagram-worker-wasm
          path: cloudflare/worker

      - name: Verify deployment files
        run: |
          test -f cloudflare/wrangler.toml
          test -f cloudflare/worker/index.js
          test -f cloudflare/worker/input_parser.mjs
          test -f cloudflare/worker/loan_worker.wasm
          test -f cloudflare/migrations/0002_processed_messages.sql

      - name: Apply staging D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.161.0"
          workingDirectory: cloudflare
          command: d1 migrations apply dfi-instagram-conversations-dev --remote --config wrangler.toml

      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.161.0"
          workingDirectory: cloudflare
          command: deploy --config wrangler.toml

  deploy:
    name: Deploy Production Website

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
